<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGNALS | BASEWAVES — Signal Literacy Through Strength</title>
  <meta name="description" content="SIGNALS — the applied dimension of BASEWAVES. Reading what your body is already broadcasting.">

  <!-- Open Graph -->
  <meta property="og:title" content="SIGNALS | BASEWAVES">
  <meta property="og:description" content="SIGNALS — the applied dimension of BASEWAVES. Reading what your body is already broadcasting.">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Option B Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- GSAP + ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'base-bg': '#0E1220',
            'base-bg-dark': '#080B14',
            'turquoise': '#58FCC8',
            'coral': '#FFA565',
            'text-primary': '#E8E3FF',
            'text-secondary': '#9994B8',
            'text-dim': '#5A5672',
          },
          fontFamily: {
            'cinzel': ['Cinzel', 'serif'],
            'ibm': ['IBM Plex Mono', 'monospace'],
            'mono': ['Space Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* ═══════════════════════════════════════════
       RESET
       ═══════════════════════════════════════════ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background-color: transparent;
      color: #E8E3FF;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════
       ENVIRONMENTAL LAYERS (z-index stack)
       ═══════════════════════════════════════════ */
    .bg-base-color {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #0E1220;
      z-index: -5;
    }

    .bg-neural {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 120%;
      background-image: url('../assets/neural_scaffolding_base.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -4;
      will-change: transform, filter, opacity;
      filter: blur(10px);
      opacity: 0.25;
    }

    .grain-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url('../assets/grain.png');
      background-repeat: repeat;
      mix-blend-mode: overlay;
      z-index: -3;
      pointer-events: none;
      will-change: opacity;
      opacity: 0.08;
    }

    .mobile-darken {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #0E1220;
      z-index: -1;
      pointer-events: none;
      will-change: opacity;
      opacity: 0;
    }

    @media (max-width: 767px) {
      .mobile-darken { display: block; }
    }

    /* ═══════════════════════════════════════════
       GLOBAL TYPOGRAPHY
       ═══════════════════════════════════════════ */
    h1, h2, h3, .headline {
      font-family: 'Cinzel', serif;
      font-weight: 400;
    }

    .body-text, p {
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.15em;
    }

    /* ═══════════════════════════════════════════
       NAVIGATION
       ═══════════════════════════════════════════ */
    .logo-container {
      opacity: 0.7;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .logo-container:hover {
      opacity: 1;
      filter: drop-shadow(0 0 12px #58FCC8) drop-shadow(0 0 24px rgba(88, 252, 200, 0.4));
    }

    .nav-link {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: #9994B8;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.3s ease;
    }

    .nav-link:hover { color: #58FCC8; }

    .nav-link.active {
      color: #E8E3FF;
    }

    .nav-separator {
      color: #5A5672;
      margin: 0 12px;
    }

    /* ═══ HAMBURGER MENU (<1024px) ═══ */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      z-index: 60;
      background: none;
      border: none;
      padding: 0;
    }

    .hamburger span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: #E8E3FF;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .nav-desktop {
      display: flex;
      align-items: center;
    }

    .nav-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 18, 32, 0.85);
      z-index: 55;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .nav-overlay.open {
      display: flex;
      opacity: 1;
    }

    .nav-overlay a {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      letter-spacing: 0.15em;
      color: #9994B8;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .nav-overlay a:hover {
      color: #58FCC8;
    }

    .nav-overlay a.active {
      color: #E8E3FF;
    }

    @media (max-width: 1023px) {
      .nav-logo {
        height: 32px;
      }

      .hamburger {
        display: flex;
      }

      .nav-desktop {
        display: none;
      }
    }

    @media (min-width: 1024px) {
      .nav-overlay {
        display: none !important;
      }
    }

    /* ═══════════════════════════════════════════
       PLACEHOLDER CONTENT
       ═══════════════════════════════════════════ */
    .placeholder-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 40px;
    }

    .placeholder-section h1 {
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.35;
      color: #E8E3FF;
      margin-bottom: 24px;
    }

    .turquoise-line {
      width: 80px;
      height: 2px;
      background-color: #58FCC8;
      margin: 0 auto 40px auto;
    }

    .placeholder-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.15em;
      color: #5A5672;
    }

    /* ═══════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════ */
    .site-footer {
      padding: 80px 40px 48px 40px;
      text-align: center;
    }

    .footer-logo {
      height: 46px;
      opacity: 0.5;
      margin-bottom: 32px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .nav-logo {
      height: 41px;
      width: auto;
    }

    .footer-nav {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-bottom: 24px;
    }

    .footer-nav a {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #9994B8;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-nav a:hover { color: #E8E3FF; }

    .footer-contact {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: #5A5672;
      margin-bottom: 16px;
    }

    .footer-contact a {
      color: #5A5672;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-contact a:hover { color: #9994B8; }

    .footer-tagline {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.05em;
      color: #5A5672;
      margin-bottom: 16px;
    }

    .footer-copyright {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: #5A5672;
    }

    /* ═══════════════════════════════════════════
       SCROLL REVEAL
       ═══════════════════════════════════════════ */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ═══════════════════════════════════════════
       MOBILE (<768px)
       ═══════════════════════════════════════════ */
    @media (max-width: 767px) {
      .bg-neural {
        filter: none !important;
        opacity: 0.08 !important;
      }

      .grain-overlay {
        opacity: 0.02 !important;
      }

      body {
        font-size: 16px;
        line-height: 1.75;
      }

      .placeholder-section {
        padding: 0 24px;
      }

      .site-footer {
        padding: 48px 24px;
      }

      .footer-nav {
        flex-direction: column;
        gap: 16px;
      }
    }

    /* ═══════════════════════════════════════════
       FALLBACK (no JS)
       ═══════════════════════════════════════════ */
    .no-js .bg-neural {
      filter: blur(0px);
      opacity: 0.08;
    }

    .no-js .grain-overlay {
      opacity: 0.02;
    }

    .no-js .reveal {
      opacity: 1;
      transform: none;
    }
  </style>
</head>
<body>
  <!-- ═══════════════════════════════════════════
       ENVIRONMENTAL LAYERS
       ═══════════════════════════════════════════ -->
  <div class="bg-base-color"></div>
  <div class="bg-neural" id="bgNeural"></div>
  <div class="grain-overlay" id="grainOverlay"></div>
  <div class="mobile-darken" id="mobileDarken"></div>

  <!-- ═══════════════════════════════════════════
       NAVIGATION
       ═══════════════════════════════════════════ -->
  <nav class="fixed top-0 left-0 right-0 z-50 px-6 py-5 flex justify-between items-center">
    <a href="/" class="logo-container block">
      <img src="../assets/Basewaves_logo.svg" alt="BASEWAVES" class="nav-logo">
    </a>

    <div class="nav-desktop">
      <a href="/" class="nav-link">HOME</a>
      <span class="nav-separator">|</span>
      <a href="/origin/" class="nav-link">ORIGIN</a>
      <span class="nav-separator">|</span>
      <a href="/method/" class="nav-link">METHOD</a>
      <span class="nav-separator">|</span>
      <a href="/signals/" class="nav-link active">SIGNALS</a>
    </div>

    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Nav Overlay -->
  <div class="nav-overlay" id="navOverlay">
    <a href="/">HOME</a>
    <a href="/origin/">ORIGIN</a>
    <a href="/method/">METHOD</a>
    <a href="/signals/" class="active">SIGNALS</a>
  </div>

  <!-- ═══════════════════════════════════════════
       PLACEHOLDER CONTENT
       ═══════════════════════════════════════════ -->
  <section class="placeholder-section">
    <h1 class="reveal">SIGNALS</h1>
    <div class="turquoise-line reveal"></div>
    <p class="placeholder-sub reveal">Coming Soon</p>
  </section>

  <!-- ═══════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════ -->
  <footer class="site-footer">
    <img src="../assets/Basewaves_logo.svg" alt="BASEWAVES" class="footer-logo">

    <nav class="footer-nav">
      <a href="/">HOME</a>
      <a href="/origin/">ORIGIN</a>
      <a href="/method/">METHOD</a>
      <a href="/signals/">SIGNALS</a>
    </nav>

    <p class="footer-contact">
      <a href="mailto:greg@basewaves.com">greg@basewaves.com</a>
      <span style="margin: 0 12px; color: #5A5672;">|</span>
      <a href="tel:+15125853400">512.585.3400</a>
    </p>

    <p class="footer-tagline">You cannot think your way out of a sensing problem.</p>

    <p class="footer-copyright">&copy; 2026 BASEWAVES</p>
  </footer>

  <!-- ═══════════════════════════════════════════
       GSAP SCROLL CONTROLLER
       ═══════════════════════════════════════════ -->
  <script>
    (function() {
      const bgNeural = document.getElementById('bgNeural');
      const grainOverlay = document.getElementById('grainOverlay');
      const mobileDarken = document.getElementById('mobileDarken');

      const gsapAvailable = typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined';
      const isMobile = window.innerWidth < 768;

      // Scroll reveal observer
      const revealElements = document.querySelectorAll('.reveal');
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.15 });

      revealElements.forEach(el => revealObserver.observe(el));

      if (gsapAvailable && !isMobile) {
        gsap.registerPlugin(ScrollTrigger);

        // Static environmental state for single-screen page
        bgNeural.style.filter = 'blur(0px)';
        bgNeural.style.opacity = '0.12';
        grainOverlay.style.opacity = '0.04';

      } else if (gsapAvailable && isMobile) {
        gsap.registerPlugin(ScrollTrigger);
        bgNeural.style.filter = 'blur(0px)';
        bgNeural.style.opacity = '0.08';
        grainOverlay.style.opacity = '0.02';

      } else {
        // FALLBACK: No GSAP
        bgNeural.style.filter = 'blur(0px)';
        bgNeural.style.opacity = '0.08';
        grainOverlay.style.opacity = '0.02';
      }

    // Hamburger menu toggle
    const hamburger = document.getElementById('hamburger');
    const navOverlay = document.getElementById('navOverlay');

    if (hamburger && navOverlay) {
      hamburger.addEventListener('click', function(e) {
        e.stopPropagation();
        hamburger.classList.toggle('active');
        navOverlay.classList.toggle('open');
        document.body.style.overflow = navOverlay.classList.contains('open') ? 'hidden' : '';
      });

      navOverlay.addEventListener('click', function(e) {
        if (e.target === navOverlay || e.target.tagName === 'A') {
          hamburger.classList.remove('active');
          navOverlay.classList.remove('open');
          document.body.style.overflow = '';
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && navOverlay.classList.contains('open')) {
          hamburger.classList.remove('active');
          navOverlay.classList.remove('open');
          document.body.style.overflow = '';
        }
      });
    }

    })();
  </script>
</body>
</html>
