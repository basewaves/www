<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BASEWAVES — Dynamic SPACE Visual</title>
  <meta name="description" content="Interactive visualization of SPACE conditions and the 7-to-1 perception ratio in Spatial Strength Training.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IBM+Plex+Mono:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --base-blue: #0E1220;
      --deep-blue: #080B14;
      --lighter-blue: #141B2E;
      --primary-text: #E8E3FF;
      --secondary-text: #9994B8;
      --dim-text: #5A5672;
      --turquoise: #58FCC8;
      --coral: #FFA565;
      --turq-glow: rgba(88, 252, 200, 0.25);
      --coral-glow: rgba(255, 165, 101, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--deep-blue);
      color: var(--primary-text);
      font-family: 'IBM Plex Mono', monospace;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .starfield {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(1px 1px at 10% 15%, rgba(232,227,255,0.4), transparent),
                  radial-gradient(1px 1px at 70% 22%, rgba(88,252,200,0.12), transparent);
    }

    /* ═══════════════════════════════════════════
       COCKPIT / UI
       ═══════════════════════════════════════════ */
    .cockpit {
      position: fixed;
      left: 20px;
      top: 20px;
      width: 300px;
      background: rgba(14, 18, 32, 0.9);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(90, 86, 114, 0.4);
      padding: 24px;
      z-index: 100;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border-radius: 2px;
    }

    .cockpit h2 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      letter-spacing: 0.15em;
      margin-bottom: 24px;
      color: var(--primary-text);
      border-bottom: 1px solid rgba(90, 86, 114, 0.3);
      padding-bottom: 12px;
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
      color: var(--secondary-text);
    }

    .control-label span.val {
      color: var(--turquoise);
      font-weight: 700;
    }

    input[type=range] {
      width: 100%;
      background: transparent;
      -webkit-appearance: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 2px;
      background: rgba(90, 86, 114, 0.4);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: var(--turquoise);
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 15px var(--turq-glow);
      transition: transform 0.2s ease;
    }

    input[type=range]:active::-webkit-slider-thumb {
      transform: scale(1.3);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(90, 86, 114, 0.3);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--dim-text);
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--turquoise); }
    input:checked + .slider:before { transform: translateX(20px); }

    .formula-box {
      margin-top: 24px;
      padding: 16px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(90, 86, 114, 0.2);
    }

    .formula-title {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: var(--dim-text);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .formula-display {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--primary-text);
      line-height: 1.5;
    }

    /* ═══════════════════════════════════════════
       VISUAL FIELD
       ═══════════════════════════════════════════ */
    .field-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 60px;
      z-index: 1;
      transition: filter 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .grasping-mode .field-container {
      filter: grayscale(1) blur(4px) contrast(0.7);
    }

    .wave-field-svg {
      width: 100%;
      max-width: 1100px;
      height: auto;
      display: block;
      transition: transform 0.5s ease;
    }

    .wave-path {
      fill: none;
      stroke: var(--dim-text);
      stroke-miterlimit: 10;
      transition: stroke 0.8s ease, stroke-width 0.4s ease, opacity 0.8s ease;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
    }

    @keyframes pulse-signal {
      from { stroke-dashoffset: 2000; }
      to { stroke-dashoffset: 0; }
    }

    .wave-path.active {
      animation: pulse-signal var(--pulse-dur, 3s) linear infinite;
    }

    /* Territorial Labels */
    .labels-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }

    .territory-label {
      position: absolute;
      font-family: 'Cinzel', serif;
      font-size: clamp(12px, 1.5vw, 18px);
      letter-spacing: 0.25em;
      opacity: 0.4;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .label-intero { bottom: 15%; left: 15%; color: var(--turquoise); }
    .label-proprio { top: 15%; right: 15%; color: var(--coral); }

    .territory-label small {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 0.6em;
      letter-spacing: 0.1em;
      margin-top: 8px;
      opacity: 0.7;
    }

    .mastery-rank {
      position: fixed;
      right: 40px;
      bottom: 40px;
      text-align: right;
      z-index: 100;
    }

    .mastery-rank p {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--dim-text);
      margin-bottom: 8px;
    }

    .mastery-rank h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(48px, 6vw, 72px);
      color: var(--turquoise);
      line-height: 1;
      text-shadow: 0 0 30px var(--turq-glow);
      transition: color 0.5s ease;
    }

    /* ═══════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════ */
    @media (max-width: 1024px) {
      .cockpit { width: 260px; padding: 16px; }
      .field-container { padding: 40px; }
    }

    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      .cockpit { position: relative; width: 100%; left: 0; top: 0; box-shadow: none; border: none; border-top: 1px solid rgba(90, 86, 114, 0.3); }
      .field-container { min-height: 50vh; }
      .mastery-rank { top: 20px; right: 20px; bottom: auto; }
    }
  </style>
</head>
<body class="exploring-mode">
  <div class="starfield"></div>

  <!-- Cockpit UI -->
  <aside class="cockpit">
    <h2>SPACE Cockpit</h2>
    
    <div class="control-group">
      <div class="control-label">Salience (S) <span class="val" id="valS">5</span></div>
      <input type="range" id="sliderS" min="1" max="10" value="5">
    </div>

    <div class="control-group">
      <div class="control-label">Pitch (P) <span class="val" id="valP">5</span></div>
      <input type="range" id="sliderP" min="1" max="10" value="5">
    </div>

    <div class="control-group">
      <div class="control-label">Ambiance (A) <span class="val" id="valA">5</span></div>
      <input type="range" id="sliderA" min="1" max="10" value="5">
    </div>

    <div class="control-group">
      <div class="control-label">Estate (E) <span class="val" id="valE">5</span></div>
      <input type="range" id="sliderE" min="1" max="10" value="5">
    </div>

    <div class="toggle-group">
      <div class="control-label">Curiosity: <span id="curiosityText">Exploring</span></div>
      <label class="toggle-switch">
        <input type="checkbox" id="toggleC" checked>

      </label>
    </div>

    <div class="formula-box">
      <div class="formula-title">Signal Mastery Formula</div>
      <div class="formula-display" id="formula">M = 0.5 × (5 × 0.2) × 5 = 2.5</div>
    </div>
  </aside>

    </svg>

    <!-- UI Overlay Labels -->
    <div class="labels-overlay">
      <div class="territory-label label-intero">
        SENSING &amp; ADAPTING
        <small>Interoception (The 7)</small>
      </div>
      <div class="territory-label label-proprio">
        THINKING &amp; POSITIONING
        <small>Proprioception (The 1)</small>
      </div>
    </div>

    <!-- Live Readout -->
    <div class="mastery-rank">
      <p>SIGNAL MASTERY INDEX</p>
      <h1 id="rankDisplay">2.50</h1>
    </div>
  </main>

  <script>
    (function() {
      const paths = document.querySelectorAll('.wave-path');
      const body = document.body;
      const rankDisplay = document.getElementById('rankDisplay');
      const formulaDisplay = document.getElementById('formula');
      const curiosityText = document.getElementById('curiosityText');
      const field = document.getElementById('field');

      const sliders = {
        S: document.getElementById('sliderS'),
        P: document.getElementById('sliderP'),
        A: document.getElementById('sliderA'),
        E: document.getElementById('sliderE'),
        C: document.getElementById('toggleC')
      };

      const valDisplays = {
        S: document.getElementById('valS'),
        P: document.getElementById('valP'),
        A: document.getElementById('valA'),
        E: document.getElementById('valE')
      };

      function update() {
        const s = parseInt(sliders.S.value);
        const p = parseInt(sliders.P.value);
        const a = parseInt(sliders.A.value);
        const e = parseInt(sliders.E.value);
        const c = sliders.C.checked ? 1 : 0;

        // UI Updates
        valDisplays.S.innerText = s;
        valDisplays.P.innerText = p;
        valDisplays.A.innerText = a;
        valDisplays.E.innerText = e;
        curiosityText.innerText = c ? "Exploring" : "Grasping";
        curiosityText.style.color = c ? "var(--turquoise)" : "var(--coral)";

        // Epistemic Gate: Curiosity
        if (c === 0) {
          body.classList.add('grasping-mode');
          rankDisplay.innerText = "NULL";
          rankDisplay.style.color = "var(--dim-text)";
          formulaDisplay.innerText = "C = Grasping (Reading Invalid)";
          return;
        }

        body.classList.remove('grasping-mode');
        rankDisplay.style.color = "var(--turquoise)";

        // Formula Calculation
        const s_gate = s / 10;
        const a_inv = 1 / a;
        const mastery = (s_gate * (p * a_inv) * e).toFixed(2);

        rankDisplay.innerText = mastery;
        formulaDisplay.innerText = `M = ${s_gate} × (${p} × ${a_inv.toFixed(2)}) × ${e} = ${mastery}`;

        // Visual Transformations
        paths.forEach((path, index) => {
          const isProprio = path.classList.contains('proprio');
          
          // Estate -> Path Weight
          const baseWidth = isProprio ? 2 : 1;
          const dynamicWidth = (baseWidth + (index * 0.1)) * (e / 5);
          path.style.strokeWidth = `${dynamicWidth}px`;

          // Salience -> Editorial Selection
          // High S highlights specific "useful" paths
          const highlightFreq = Math.max(1, 11 - s);
          const isHighlighted = (index % highlightFreq) === 0;
          
          if (isHighlighted) {
            path.classList.add('active');
            path.style.stroke = isProprio ? 'var(--coral)' : 'var(--turquoise)';
            path.style.opacity = (0.3 + (s / 15)).toFixed(2);
            path.style.filter = `drop-shadow(0 0 ${s/2}px ${isProprio ? 'var(--coral-glow)' : 'var(--turq-glow)'})`;
          } else {
            path.classList.remove('active');
            path.style.stroke = 'var(--dim-text)';
            path.style.opacity = (0.1 * (s / 10)).toFixed(2);
            path.style.filter = 'none';
          }

          // Pitch -> Pulse Duration (Tempo)
          const pulseDur = (11 - p) * 0.4; // 1 = 4s, 10 = 0.4s
          path.style.setProperty('--pulse-dur', `${pulseDur}s`);
        });

        // Ambiance -> Global Noise Floor (Blur)
        const ambianceBlur = (a - 1) * 0.4;
        field.style.filter = `blur(${ambianceBlur}px)`;
      }

      // Interaction listeners
      Object.values(sliders).forEach(slider => {
        slider.addEventListener('input', update);
      });

      // Initial state
      update();

      // Mouse parallax for immersion
      document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 20;
        const y = (e.clientY / window.innerHeight - 0.5) * 10;
        const svg = document.querySelector('.wave-field-svg');
        if (svg) svg.style.transform = `translate(${x}px, ${y}px)`;
      });

    })();
  </script>
</body>
</html>
